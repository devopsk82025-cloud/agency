<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Ganesh</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"></head>
<body><main class="auth-shell"><a class="back-link" href="index.html">← Back to website</a><section class="auth-card"><div class="brand-mark">G</div><p class="eyebrow">AGENCY PORTAL</p><h1>Create your account</h1><p class="muted">Register as a student or hiring company.</p><form id="registerForm"><label>Full name / Contact person<input id="fullName" type="text" autocomplete="name" required placeholder="Your name"></label><label>Email address<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></label><label>Account type<select id="role" required><option value="student">Student</option><option value="company">Company</option></select></label><button class="primary" type="submit">Create account</button><p id="message" class="message" role="status"></p></form><p class="switch">Already registered? <a href="login.html">Sign in</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/register.js"></script></body></html>
